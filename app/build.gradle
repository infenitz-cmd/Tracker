plugins {
    id 'com.android.application'
}
android {
    namespace 'com.family.expenses'
    compileSdk 34
    defaultConfig {
        applicationId "com.family.expenses"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
